[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wing_assembler"
version = "0.1.0"
description = "Rod-reinforced printed wing panels: definition in, printable STLs out."
readme = "wing_assembler/README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "shapely>=2.0",
    "build123d>=0.7",
]

[project.scripts]
wing-assembler = "wing_assembler.generate:main"

[tool.setuptools]
packages = ["wing_assembler", "wing_assembler.geometry"]

[tool.setuptools.package-data]
wing_assembler = ["airfoils/*.dat"]
